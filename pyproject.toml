[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-zero-downtime-migrations"
version = "0.13.0"
description = "A catalogue of PostgreSQL 16 schema changes that hold under load, plus a linter for the forms that do not"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahtisham Farooq", email = "ahtishamm.farooq@gmail.com" }]
dependencies = []

[project.scripts]
pgsafe = "pgsafe.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pglast==6.14"]

[tool.setuptools.packages.find]
include = ["pgsafe*"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
